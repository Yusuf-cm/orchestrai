services:
  - type: web
    name: waypoint-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && cp backend/prisma/schema.postgresql.prisma backend/prisma/schema.prisma && npm run build -w backend && cd backend && npx prisma db push && npx prisma db seed
    startCommand: npm run start -w backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
    healthCheckPath: /health

  - type: web
    name: waypoint-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 43123
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: waypoint-db
    plan: free
    databaseName: waypoint
    user: waypoint
