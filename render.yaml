services:
  - type: web
    name: waypoint-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npm run build -w packages/shared &&
      cp backend/prisma/schema.postgresql.prisma backend/prisma/schema.prisma &&
      npx prisma generate --schema backend/prisma/schema.prisma &&
      npm run build -w backend &&
      npx prisma db push --schema backend/prisma/schema.prisma --skip-generate --accept-data-loss
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      # The frontend origin. Supports a wildcard subdomain, so
      # https://*.onrender.com survives Render's generated service suffixes.
      - key: CORS_ORIGIN
        value: https://*.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      # Optional. Point at an OpenAI-compatible endpoint (e.g. NVIDIA NIM)
      # instead of OpenAI itself. Leave unset to use OpenAI directly.
      - key: OPENAI_BASE_URL
        sync: false
      # Optional. Defaults to gpt-4o-mini. Must match whatever OPENAI_BASE_URL serves.
      - key: OPENAI_MODEL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      # Same speaker; eleven_v3 is what actually pronounces Kiswahili.
      - key: ELEVENLABS_VOICE_ID_SW
        value: 21m00Tcm4TlvDq8ikWAM
      - key: VOICE_CACHE_DIR
        value: /tmp/waypoint-voice

  - type: web
    name: waypoint-web
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npm run build -w packages/shared &&
      npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 43123
      # The real API host. Render appends a suffix to the service name, so
      # https://waypoint-api.onrender.com 404s. This is inlined at build time.
      - key: NEXT_PUBLIC_API_URL
        value: https://waypoint-api-xh6v.onrender.com
      - key: API_URL
        value: https://waypoint-api-xh6v.onrender.com

databases:
  - name: waypoint-db
    plan: free
    databaseName: waypoint
    user: waypoint
