workflow:
  id: health.musculoskeletal_nav_v1
  version: "1.0.0"
  domain: healthcare
  adapter: health-adapter-v1
  institution: health-mock
  title: Navigate Care for Joint/Musculoskeletal Pain

  slots:
    - name: symptom_description
      type: string
      required: true
    - name: duration_weeks
      type: number
      required: true
    - name: severity_1_10
      type: number
      required: true
    - name: insurance_carrier
      type: string
      required: false
    - name: zip_code
      type: string
      required: true
    - name: selected_provider_id
      type: string
      required: false
    - name: care_level
      type: string
      required: false

  steps:
    - id: symptom_intake
      type: collect_input
      mode: assist
      title: Tell us about your symptoms
      description: This is not a diagnosis — we help you find appropriate care
      inputs: [symptom_description, duration_weeks, severity_1_10, insurance_carrier, zip_code]
      transitions:
        - to: urgency_screen
          when: slots_filled

    - id: urgency_screen
      type: validate
      mode: execute
      title: Safety screening
      handler: health.urgencyTriage
      transitions:
        - to: emergency_redirect
          when: care_level == emergency
        - to: care_recommendation
          when: care_level != emergency

    - id: emergency_redirect
      type: guide_user
      mode: escalate
      title: Seek emergency care
      description: Based on your symptoms, please seek emergency care immediately
      transitions:
        - to: resolved
          when: always

    - id: care_recommendation
      type: lookup
      mode: execute
      title: Care recommendation
      handler: health.recommendCareType
      transitions:
        - to: find_providers
          when: always

    - id: find_providers
      type: lookup
      mode: execute
      title: Finding providers
      handler: health.findProviders
      transitions:
        - to: select_provider
          when: always

    - id: select_provider
      type: collect_input
      mode: assist
      title: Choose a provider
      transitions:
        - to: prepare_for_visit
          when: provider_selected

    - id: prepare_for_visit
      type: document_required
      mode: assist
      title: Prepare for your visit
      handler: health.prepareVisit
      transitions:
        - to: schedule_appointment
          when: always

    - id: schedule_appointment
      type: appointment
      mode: assist
      title: Schedule appointment
      transitions:
        - to: appointment_reminder
          when: appointment_scheduled

    - id: appointment_reminder
      type: reminder
      mode: execute
      title: Appointment scheduled
      transitions:
        - to: post_visit_followup
          when: always

    - id: post_visit_followup
      type: ask_question
      mode: assist
      title: After your visit
      description: Did you receive a referral or need follow-up care?
      transitions:
        - to: resolved
          when: user_confirms

    - id: resolved
      type: completion
      mode: guide
      title: Case resolved

  completion:
    step: resolved
